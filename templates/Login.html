{% extends "Base.html" %}

{% block title %}Login page{% endblock %}

{% block content %}
    <div class="register-login-update-container">
        <h2>Login</h2>
        <form action="{{ request.url_for('login') }}" method="post">
            <input type="text" name="email" placeholder="Write your email">
            <input type="password" name="password" placeholder="Write your password">
            <button type="submit">Login</button>

            <p>Don't have an account?
                <a href="/register">Register</a>
            </p>
        </form>
    </div>
    
{% endblock %}
