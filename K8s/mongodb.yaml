apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb-container
        image: mongodb/mongodb-atlas-local:latest
        ports:
          - containerPort: 27017
        env:
          - name: MONGODB_INITDB_ROOT_USERNAME
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: MONGODB_INITDB_ROOT_USERNAME

          - name: MONGODB_INITDB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: MONGODB_INITDB_ROOT_PASSWORD

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"    
        volumeMounts:
          - name: mongodb-storage
            mountPath: /data/db
      volumes:
      - name: mongodb-storage
        persistentVolumeClaim:
          claimName: mongodb-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP

